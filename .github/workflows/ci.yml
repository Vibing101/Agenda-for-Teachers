# The milestone gate from docs/ENGINEERING.md, steps 1-4.
#
# Steps 5 (launch from inside a real cloud-synced folder on both OSes) and 6
# (the dated release note) are human steps by nature and are recorded in
# docs/milestones/ instead — CI cannot install Google Drive or OneDrive and
# double-click an app.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # --- Gate step 1: typecheck ---
      - name: Typecheck
        run: npm run typecheck

      # --- Gate step 2: lint (both sides) ---
      - name: Lint frontend
        run: npm run lint

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # macOS ships as a universal binary so it runs natively on both Intel and
      # Apple Silicon rather than falling back to Rosetta on an M-series Mac.
      - name: Add macOS build targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # --- Gate step 3: tests ---
      - name: Frontend tests
        run: npm test

      # Covers the persistence round-trip and the backup-retention rules.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # --- Gate step 4: packaged build ---
      - name: Packaged build (macOS, universal)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Packaged build (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build

      # Structural check that the bundle is really there and really executable,
      # rather than trusting that the build command exited 0.
      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Teacher Planner.app"
          BIN="$APP/Contents/MacOS/teacher-planner"
          test -d "$APP"                     || { echo "::error::no .app bundle"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "::error::no Info.plist"; exit 1; }
          test -x "$BIN"                     || { echo "::error::binary missing or not executable"; exit 1; }
          # Must carry both slices, or an Apple Silicon Mac falls back to Rosetta.
          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: $ARCHS"
          grep -q x86_64 <<<"$ARCHS" || { echo "::error::missing x86_64 slice"; exit 1; }
          grep -q arm64  <<<"$ARCHS" || { echo "::error::missing arm64 slice"; exit 1; }
          echo "Bundle OK: $(du -sh "$APP" | cut -f1)"

      # Gate step 5 in the form CI can manage: launch the real bundle from a
      # folder shaped like the user's actual cloud folder and confirm it creates
      # its data file there. Not a substitute for the manual cloud-sync run.
      - name: Smoke launch the macOS bundle from a cloud-shaped folder
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          SRC="src-tauri/target/universal-apple-darwin/release/bundle/macos/Teacher Planner.app"
          DIR="$RUNNER_TEMP/My Drive/Ημερολόγιο Εκπαιδευτικού"
          mkdir -p "$DIR"
          cp -R "$SRC" "$DIR/"
          "$DIR/Teacher Planner.app/Contents/MacOS/teacher-planner" &
          PID=$!
          for _ in $(seq 1 30); do
            [ -f "$DIR/data/planner.sqlite" ] && break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          test -f "$DIR/data/planner.sqlite" || { echo "::error::app did not create its data file"; exit 1; }
          test -d "$DIR/data/backups"        || { echo "::error::no backups folder"; exit 1; }
          test -d "$DIR/exports"             || { echo "::error::no exports folder"; exit 1; }
          echo "Launched and wrote its data file from: $DIR"

      - name: Verify the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "src-tauri/target/release/teacher-planner.exe"
          if (!(Test-Path $exe)) { Write-Error "no .exe produced" }
          $installer = Get-ChildItem -Recurse -Filter *-setup.exe `
            -Path src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          if (!$installer) { Write-Error "no NSIS installer produced" }
          Write-Host "Bundle OK: $exe and $($installer.Name)"

      # The closest CI can get to gate step 5 on Windows: launch the real binary
      # from a path shaped like the user's own — Greek characters, spaces, deep
      # nesting, mirroring "My Drive\Ημερολόγιο Εκπαιδευτικού". Unicode path handling
      # is a classic Windows-only break.
      #
      # This runs WITHOUT a Mark-of-the-Web tag. The tagged case is recorded
      # separately below, but only informationally — see the note there for why
      # a runner cannot tell you anything about SmartScreen.
      - name: Smoke launch the Windows build from a cloud-shaped folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "My Drive\Ημερολόγιο Εκπαιδευτικού"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "Teacher Planner.exe"
          Copy-Item "src-tauri/target/release/teacher-planner.exe" $exe

          $proc = Start-Process -FilePath $exe -PassThru
          $db = Join-Path $dir "data\planner.sqlite"
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $db) { break }
            Start-Sleep -Seconds 1
          }
          $alive = -not $proc.HasExited
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          if (!(Test-Path $db)) { Write-Error "app did not create its data file at $db" }
          if (!(Test-Path (Join-Path $dir "data\backups"))) { Write-Error "no backups folder" }
          if (!(Test-Path (Join-Path $dir "exports")))       { Write-Error "no exports folder" }
          if (!$alive) { Write-Error "the app exited on its own instead of staying open" }
          Write-Host "Launched from a Greek, space-containing path and wrote its data file."

      # M0's backup criterion, checked on Windows: a second launch against an
      # existing data file must leave a dated snapshot behind.
      - name: Verify a relaunch writes a backup snapshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "My Drive\Ημερολόγιο Εκπαιδευτικού"
          $exe = Join-Path $dir "Teacher Planner.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          $snaps = Get-ChildItem -Path (Join-Path $dir "data\backups") -Filter "planner-*.sqlite"
          if ($snaps.Count -lt 1) { Write-Error "relaunch left no backup snapshot" }
          Write-Host "Snapshot written on relaunch: $($snaps[0].Name)"

      # Mark of the Web: anything the teacher downloads, or that arrives through a
      # sync client, can carry a Zone.Identifier stream marking it as internet-sourced.
      # On a real machine an unsigned build carrying that tag is stopped by
      # SmartScreen ("Windows protected your PC") until the user picks
      # More info -> Run anyway.
      #
      # THIS STEP CANNOT MEASURE THAT, and does not try to. Verified on a physical
      # Windows 11 machine on 2026-09-20 (see the M1 release note): with SmartScreen
      # on, both Start-Process and Shell.InvokeVerb("open") launch a tagged, unsigned
      # build CLEANLY with no dialog — only a genuine Explorer double-click is
      # blocked — and a headless runner has no interactive desktop to show the dialog
      # anyway. An earlier version of this step asserted a blocked launch as a
      # tripwire; it passed for the wrong reason and would have reported a false
      # conclusion if signing ever landed, so that assertion has been removed.
      #
      # What is left is a recording step. It never fails the build. The real check
      # is a human double-click, which is gate step 5 and lives in docs/milestones/.
      - name: Record how Mark of the Web behaves on the runner (Windows, informational)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $dir = Join-Path $env:RUNNER_TEMP "motw-test"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "Teacher Planner.exe"
          Copy-Item "src-tauri/target/release/teacher-planner.exe" $exe
          Set-Content -Path "$exe`:Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3"
          Write-Host "Zone.Identifier applied:"
          Get-Content -Path "$exe`:Zone.Identifier"

          $launched = $false
          try {
            $proc = Start-Process -FilePath $exe -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 10
            $launched = -not $proc.HasExited
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Start-Process threw: $($_.Exception.Message)"
          }

          Write-Host "Observed on this runner: tagged build launched via Start-Process = $launched"
          Write-Host "::warning::Informational only. This does NOT tell you whether SmartScreen would stop the teacher — only a real Explorer double-click on a desktop machine does, and that is gate step 5. Windows code signing remains an open decision; see Carried risks in docs/SPEC.md."

      # M10: the plain teacher-planner.exe too, not only the installer. The
      # teacher runs the exe from her synced folder (the app keeps its data
      # beside its own executable), so it is the Windows file in the handover
      # folder; the installer would put her data outside that folder.
      - name: Upload the packaged build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-planner-${{ matrix.os }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/teacher-planner.exe
          if-no-files-found: ignore
          retention-days: 14
