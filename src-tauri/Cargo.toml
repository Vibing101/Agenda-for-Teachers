[package]
name = "teacher-planner"
version = "0.1.0"
description = "Ατζέντα Εκπαιδευτικού — teacher planner"
authors = ["Teacher Planner"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "teacher_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = "0.4"
thiserror = "2"

# PDF export reaches into the platform's own webview, because Tauri 2 has no
# cross-platform print-to-PDF command. Both of these are already in the tree
# via wry, so this pins the same versions rather than pulling a second copy.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-pdf-kit = { version = "0.3.2", features = ["PDFDocument", "PDFPage"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
